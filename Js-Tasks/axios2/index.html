<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>Suppliers</title>
</head>

<body class="max-w-[1320px] w-[80%] mx-auto">

    <!-- ADD FORM -->
    <div class="mt-10 bg-white p-6 rounded-2xl shadow-lg">
        <h2 class="text-xl font-semibold mb-4 text-gray-800">Add Supplier</h2>
        <form id="addForm" class="flex flex-col md:flex-row gap-4">
            <input id="companyName" type="text" placeholder="Company Name..."
                class="border border-gray-300 rounded-xl px-4 py-2 w-full focus:outline-none focus:ring-2 focus:ring-blue-400">
            <input id="contactTitle" type="text" placeholder="Contact Title..."
                class="border border-gray-300 rounded-xl px-4 py-2 w-full focus:outline-none focus:ring-2 focus:ring-blue-400">
            <button type="submit" class="bg-blue-500 hover:bg-blue-700 text-white px-6 py-2 rounded-xl transition">
                Add
            </button>

        </form>
    </div>

    <!-- CARDS -->
    <div id="elements" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 mt-8 gap-[30px]">
    </div>

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="./main.js"></script>

</body>

</html>
